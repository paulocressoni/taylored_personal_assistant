# infra/compose/docker-compose.dev.yml  (M12, M28)
# ------------------------------------------------------------------
# DEV overlay ON TOP OF base.yml. Contains ONLY dev differences:
#   - bind mounts  : live code, no rebuild on every edit
#   - --reload     : uvicorn restarts on every .py change
#   - vite dev     : frontend HMR
#   - ports        : open services to the host browser
#   - checkpoints  : DEV-only SQLite memory volume (M28 — base.yml no
#                    longer ships it; prod uses Postgres instead)
#
# Merge semantics in action:
#   - `command:`       overrides base (scalar wins)
#   - `environment:`   merges per key (LANGFUSE_BASE_URL overridden)
#   - `ports:`/`volumes:` concatenate with base
#
# PROJECT NAME: this overlay is meant to run as `taylored-assistant-dev`
# (-p in the Makefile / COMPOSE_PROJECT_NAME), giving dev its own volumes
# and containers - fully separate from prod (taylored-assistant-prod), so
# dev and prod never share conversation data.
# ------------------------------------------------------------------

services:
  backend:
    # python -m uvicorn keeps cwd (/app) on sys.path — the verified-safe
    # invocation in this project. --reload-dir scopes the watcher to the
    # mounted source only (so the venv isn't watched).
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    environment:
      ENV: dev
      # Override the HOST-oriented URL from backend/.env.dev: inside the
      # Compose network the SDK must reach Langfuse by SERVICE NAME.
      LANGFUSE_BASE_URL: http://langfuse-web:3000
    env_file:
      # Real secrets (DEEPSEEK_API_KEY, Langfuse keys) come from the
      # git-ignored backend/.env.dev, injected as container env vars.
      - ../../backend/.env.dev
    volumes:
      # DEV-only SQLite conversation memory. The named volume persists
      # checkpoints.db across container recreation.
      #
      # TODO: mounting it at /app hides the image's /app/.venv, so the
      # container runs whatever venv this volume was FIRST seeded with.
      # Docker copies image content into a named volume only when the volume
      # is created, so any dependency added after that (e.g. the voice extras
      # numpy/onnxruntime) is absent at runtime while the image itself is
      # correct: startup dies with ModuleNotFoundError and `up --build`
      # cannot fix it. Meanwhile, unblock by dropping the volume
      # (`docker volume rm taylored-assistant-dev_checkpoints_data`) and
      # bringing the stack back up, which reseeds it from the current image.
      #
      # PROPER FIX — do when the checkpointer path is next touched, then
      # delete this TODO: keep the DB out of /app. Mount this volume at
      # /app/data, set CHECKPOINT_DB_PATH=/app/data/checkpoints.db
      # (see backend/.env.dev.example), and pre-create /app/data owned by
      # appuser in backend/Dockerfile so the seeded volume stays writable.
      - checkpoints_data:/app
      # Bind-mount ONLY app/ so the image's /app/.venv (Linux) is NOT
      # shadowed by the host's Windows .venv. uvicorn --reload watches
      # /app/app and restarts on every .py edit.
      - ../../backend/app:/app/app
    ports:
      - "8000:8000"

  frontend:
    # Select the `dev` TARGET of frontend/Dockerfile (node + Vite). The
    # Dockerfile is now multi-stage: `dev` for this overlay, prod nginx
    # is the default target that CI/GHCR builds. base.yml supplies the
    # build context; the overlay only overrides the target. The dev
    # stage's CMD already runs `npm run dev`, so no `command:` override
    # is needed here anymore.
    build:
      target: dev
    environment:
      # The vite proxy (vite.config.ts) forwards /ws, /openapi.json,
      # /sessions, /health to this target. Inside the container it must
      # be the backend SERVICE NAME, not localhost.
      BACKEND_URL: http://backend:8000
    volumes:
      # Full source so Vite serves index.html, public/, src/ live...
      - ../../frontend:/app
      # ...but MASK node_modules with an anonymous volume: the image's
      # (Linux) node_modules is copied in on first start; the host's
      # (Windows) node_modules must NOT shadow it.
      - /app/node_modules
    ports:
      - "5173:5173"

  langfuse-web:
    # Only the browser-facing UI port is opened in dev. All other
    # Langfuse services stay internal (no host port needed).
    ports:
      - "3000:3000"

volumes:
  # DEV-only SQLite checkpoints volume (base.yml no longer declares it —
  # prod checkpoints live in the app-db Postgres, see prod.yml). Named
  # volume so `docker compose down` keeps it; `down -v` resets all dev data.
  checkpoints_data:
