# infra/compose/docker-compose.base.yml  (M12)
# ------------------------------------------------------------------
# BASE compose file: the WHOLE stack, environment-agnostic.
#
# Overlay model (merged with -f flags). Each environment pins its OWN
# project name with -p (the `name:` below is a neutral fallback only):
#   docker compose -p taylored-assistant-dev -f base.yml -f dev.yml up   # dev
#   docker compose -p taylored-assistant-prod -f base.yml -f prod.yml up # prod
# Distinct project names => dev/prod never share volumes or data.
#
# Merge rules relied on below:
#   - later files OVERRIDE scalar values (command, etc.)
#   - environment maps MERGE per key
#   - ports/volumes lists CONCATENATE
#
# THE RULE (M08 #4, reinforced): containers reach each other by SERVICE
# NAME on the default project network — never "localhost". Every *_HOST /
# *_URL below uses service names for container-to-container traffic.
#
# Profiles: services tagged `observability` are OPTIONAL. `--profile
# observability` starts them; without it they are skipped entirely, giving
# a lightweight run that still boots backend + frontend.
# ------------------------------------------------------------------

name: taylored-assistant

services:
  # ===================== APPLICATION =====================

  backend:
    build:
      context: ../../backend
    image: taylored-assistant-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      # app/core/config.py requires ENV=dev|prod. The overlays set the
      # concrete value; this default keeps base.yml runnable on its own.
      ENV: ${APP_ENV:-dev}
    depends_on:
      # Best-effort observability. `required: false` (Compose >= 2.20)
      # means: wait for Langfuse healthy IF the observability profile is
      # active, but DON'T block the backend when it is skipped. This is
      # what makes `dev-up-light` possible.
      langfuse-web:
        condition: service_healthy
        required: false
    # The image's HEALTHCHECK (curl http://localhost:8000/health) drives
    # `condition: service_healthy` for anything depending on the backend.

  frontend:
    build:
      context: ../../frontend
    image: taylored-assistant-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # ============ OBSERVABILITY (Langfuse v4, from M08) ============
  # All six services carry the SAME profile, so they come up and go down
  # together. No ports are published here — dev.yml opens what the host
  # browser needs.

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.30.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &langfuse_env
      # --- transactional DB (Postgres) ---
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set in your env file (.env.dev / .env.prod)}@postgres:5432/postgres
      SALT: ${SALT:?set in your env file (.env.dev / .env.prod)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in your env file (.env.dev / .env.prod)}
      # --- queue / cache (Redis) ---
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_AUTH:?set in your env file (.env.dev / .env.prod)}
      # --- traces DB (ClickHouse) ---
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in your env file (.env.dev / .env.prod)}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      # --- object storage (MinIO) ---
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in your env file (.env.dev / .env.prod)}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in your env file (.env.dev / .env.prod)}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      # --- the app talking to itself: M08 #4 in action ---
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_WEB_HOST: http://langfuse-web:3000
      LANGFUSE_WORKER_HOST: http://langfuse-worker:3030
      LANGFUSE_INGESTION_HOST: http://langfuse-web:3000
      # --- auth (browser-facing, so localhost IS correct here) ---
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in your env file (.env.dev / .env.prod)}
      # --- runtime ---
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # --- headless init: auto-create org + project + admin user ---
      LANGFUSE_INIT_ORG_ID: dev-org
      LANGFUSE_INIT_ORG_NAME: Dev Org
      LANGFUSE_INIT_PROJECT_ID: dev-project
      LANGFUSE_INIT_PROJECT_NAME: Dev Project
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set in your env file (.env.dev / .env.prod)}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set in your env file (.env.dev / .env.prod)}
      LANGFUSE_INIT_USER_EMAIL: dev@localhost.local
      LANGFUSE_INIT_USER_NAME: Dev Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set in your env file (.env.dev / .env.prod)}
    healthcheck:
      # Tolerant: a 200 OR 404 proves the server is up; only 5xx/refused = not ready.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.30.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *langfuse_env
      PORT: "3030"

  postgres:
    image: postgres:17.11
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in your env file (.env.dev / .env.prod)}
      POSTGRES_DB: postgres
      TZ: UTC          # Langfuse REQUIRES UTC on Postgres AND ClickHouse
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.11.4
    profiles: ["observability"]
    restart: unless-stopped
    user: "101:101"    # official image UID/GID — avoids volume permission errors
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in your env file (.env.dev / .env.prod)}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  redis:
    image: redis:7.4.11
    profiles: ["observability"]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_AUTH:?set in your env file (.env.dev / .env.prod)}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio@sha256:ab73368025bb948190c734b619d2bdf25e4da600d7f6aa3453818c449e52be86
    profiles: ["observability"]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in your env file (.env.dev / .env.prod)}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

volumes:
  # Langfuse stack data — all persistent and all part of the backup
  # routine (see infra/backup/). Survive `docker compose down`.
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  redis_data:
  minio_data:
