# frontend/nginx.conf
# ------------------------------------------------------------------
# Server block for the frontend's nginx image (the prod target of
# frontend/Dockerfile). It serves the built SPA and reverse-proxies the
# SAME relative API/WS paths that vite.config.ts proxies in dev, so the
# browser always talks to ONE origin.
#
# The upstream host below is the docker-compose SERVICE NAME (backend),
# resolved at runtime inside the compose network — containers never
# reach each other by localhost. Keep a `backend` service on the same
# network (base.yml already orders frontend after backend is healthy).
#
# RULE: any NEW backend path the frontend calls must be added here too
# (mirror the additions you'd make to the vite.config.ts proxy list).
# ------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Proxy headers. Declared at server level so every `location`
    # --- below inherits them (nginx directives inherit downward).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- REST + schema endpoints -> backend -------------------------
    # No URI on proxy_pass => the original request path is forwarded
    # unchanged (backend expects /sessions/..., /health, /openapi.json).
    location /sessions {
        proxy_pass http://backend:8000;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location /openapi.json {
        proxy_pass http://backend:8000;
    }

    # --- WebSocket chat streaming -> backend ------------------------
    # The whole chat UI streams tokens over /ws/chat, so this needs the
    # HTTP/1.1 upgrade dance and long timeouts (the model can pause
    # between tokens far longer than nginx's 60s default).
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Hashed build assets: cache forever (immutable by content hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Everything else = the SPA --------------------------------
    # Try the literal file, then fall back to index.html so client-side
    # routes (deep links) resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
