name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    # Fast, cheap, deterministic — guards every push/PR. NO DEEPSEEK_API_KEY
    # is configured anywhere: the unit suite is fully mocked.
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                # Working directory is the backend/ subdir, so uv commands can be run directly.
                working-directory: backend
        steps:
            # Checkout the repo
            - uses: actions/checkout@v7.0.1

            # Install uv and Python
            - name: Install uv and Python
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  python-version: "3.12"
                  # Cache the venv + downloaded wheels, keyed on the lockfile.
                  enable-cache: true
                  cache-dependency-glob: "backend/uv.lock"

            # Install dependencies (from lockfile) — --frozen fails the job if
            # uv.lock is stale vs pyproject.toml, so drift can't slip in.
            - name: Sync dependencies (from uv.lock)
              run: uv sync --frozen

            # Lint + format + type-check + unit tests (mocked, no API)
            - name: Lint
              run: uv run ruff check .

            # Format check
            - name: Format check
              run: uv run ruff format --check .

            # Type check
            - name: Type check
              run: uv run mypy app

            # Unit tests (mocked, no API)
            - name: Unit tests (mocked, no API)
              env:
                  ENV: dev
              run: |
                  cp .env.dev.example .env.dev
                  uv run pytest -m "not integration"

    # Frontend: type-check + lint + format + build. Mirrors the backend job.
    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                # Working directory is the frontend/ subdir, so npm commands can be run directly.
                working-directory: frontend
        steps:
            - uses: actions/checkout@v7.0.1

            # Install Node + dependencies (from lockfile) + lint + format + type-check + unit tests + build
            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: frontend/.nvmrc
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            # Install dependencies (from lockfile)
            - name: Install dependencies (from lockfile)
              run: npm ci # ci here means clean install, not continuous integration

            # Lint + format + type-check + build
            - name: Lint
              run: npm run lint

            # Format check
            - name: Format check
              run: npm run format:check

            # Unit tests (Vitest + jsdom — pure logic, no backend, no network)
            - name: Unit tests (no backend)
              run: npm run test

            # Type check
            - name: Type check + build
              run: npm run build

    # OpenAPI -> TypeScript drift check: boot the real backend,
    # regenerate frontend/src/api/types.ts from its /openapi.json, and fail if
    # the committed generated file differs. Guards the hand-committed contract.
    openapi-types-drift:
        runs-on: ubuntu-latest
        steps:
            # Checkout the repo
            - uses: actions/checkout@v7.0.1

            # Install uv and Python (same pattern as the backend job)
            - name: Install uv and Python
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  python-version: "3.12"
                  enable-cache: true
                  cache-dependency-glob: "backend/uv.lock"

            # Install Node (same pattern as the frontend job)
            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: frontend/.nvmrc
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            # Backend deps, from the lockfile
            - name: Sync backend dependencies
              working-directory: backend
              run: uv sync --frozen

            # The app refuses to boot without ENV + a .env.dev template.
            - name: Prepare dev env
              working-directory: backend
              run: cp .env.dev.example .env.dev

            # Start uvicorn on :8000 and wait until /openapi.json responds.
            # Langfuse is forced off so no observability client is constructed.
            # The placeholder keys in .env.dev.example satisfy Settings' fail-fast
            # validator; pre-warming only CONSTRUCTS models (no network call).
            - name: Start backend
              working-directory: backend
              env:
                  ENV: dev
                  LANGFUSE_ENABLED: "false"
              run: |
                  nohup uv run python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
                  for i in $(seq 1 30); do
                    if curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null; then
                      echo "backend is up"
                      exit 0
                    fi
                    sleep 1
                  done
                  echo "backend did not become ready" >&2
                  cat uvicorn.log >&2
                  exit 1

            # Frontend deps, then regenerate types from the LIVE schema.
            - name: Install frontend dependencies
              working-directory: frontend
              run: npm ci

            # Regenerate and fail on drift: any schema change that was not
            # reflected in the committed types.ts makes git diff non-empty.
            - name: Regenerate types and fail on drift
              working-directory: frontend
              run: |
                  npm run types
                  git diff --exit-code -- src/api/types.ts

    # Secret scanning over the FULL history — a leaked key can't hide in an
    # old commit. Separate job so it scans the whole monorepo and can't be
    # skipped when a lint failure aborts the backend job.
    secret-scan:
        runs-on: ubuntu-latest
        permissions:
            contents: read          # for actions/checkout
            pull-requests: read     # gitleaks lists the PR's commits via the REST API
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0 # gitleaks needs the complete git history

            # Secret scan (gitleaks)
            - name: Secret scan (gitleaks)
              uses: gitleaks/gitleaks-action@v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Build BOTH production images and fail on any fixable HIGH/CRITICAL
    # vulnerability BEFORE they can ever reach main or a release. No push,
    # no registry login — this is the "does it build and is it clean" gate
    # that runs on every PR and main push. Mirrors exactly what the
    # docker-publish workflow will do on a release tag.
    docker-image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            # One broken image shouldn't cancel the other's scan.
            fail-fast: false
            matrix:
                include:
                    # Each image names its EXPLICIT build target (never the
                    # implicit last stage). gha cache is scoped per image so
                    # the two never overwrite each other's cache entries.
                    - name: taylored-personal-assistant-backend
                      context: backend
                      target: runtime
                      cache-scope: backend
                    - name: taylored-personal-assistant-frontend
                      context: frontend
                      target: prod
                      cache-scope: frontend
        steps:
            # Checkout the repo
            - uses: actions/checkout@v7.0.1

            # Buildx is required for the GitHub Actions layer cache
            # (type=gha) that build-push-action reads/writes.
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.3.0

            # Build the image but DO NOT push. `load: true` exports it into
            # the runner's docker daemon so the Trivy step can scan it.
            - name: Build image (no push)
              uses: docker/build-push-action@v7.3.0
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.context }}/Dockerfile
                  target: ${{ matrix.target }}
                  load: true
                  tags: ${{ matrix.name }}:ci
                  cache-from: type=gha,scope=${{ matrix.cache-scope }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

            # Fail the PR on any fixable HIGH/CRITICAL finding.
            # `ignore-unfixed: true` means known-unfixable OS CVEs in the
            # base images don't red-flag the build (they can't be acted on).
            - name: Trivy vulnerability scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: ${{ matrix.name }}:ci
                  severity: HIGH,CRITICAL
                  exit-code: '1'
                  ignore-unfixed: true
