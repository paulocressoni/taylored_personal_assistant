[project]
name = "backend"
version = "0.2.0"
description = "Smart home assistant backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2==2.12.0",
    "langchain>=1.3.16",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.5.1",
    "langfuse>=4.14.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "lingua-language-detector>=2.2.0",
    "psycopg[binary]==3.3.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Fast unit suite by default; integration tests (live DeepSeek API) opt in.
addopts = "-m 'not integration'"
markers = [
    "integration: live DeepSeek API smoke tests (excluded from the fast suite by default)",
]
python_files = ["test_*.py", "smoke_*.py"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
