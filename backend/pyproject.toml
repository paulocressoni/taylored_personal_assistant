[project]
name = "backend"
version = "0.3.1"
description = "Smart home assistant backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2==2.12.0",
    "langchain>=1.3.16",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.5.1",
    "langfuse>=4.14.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "lingua-language-detector>=2.2.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "openai>=3.1.0",
    "psycopg[binary]==3.3.5",
    "pydantic-settings>=2.15.0",
    # Security floor, not a direct import: `requests` (reached through langsmith
    # and langfuse) pulls urllib3 in, and anything below 2.8.0 carries two HIGH
    # CVEs -- an HTTPS proxy TLS override and a chunk-parser DoS.
    "urllib3>=2.8.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Ship the vendored VAD graph with the package. Neither the Docker image (which
# copies `app/` wholesale) nor the editable dev install needs this, but a plain
# wheel build would silently omit the .onnx and only fail at the first turn.
[tool.setuptools.package-data]
"app.voice" = ["models/*.onnx"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
# Fast unit suite by default; integration tests (live DeepSeek API) opt in.
addopts = "-m 'not integration'"
markers = [
    "integration: live DeepSeek API smoke tests (excluded from the fast suite by default)",
]
# Voice providers and the voice session are async: run async tests without a
# per-test marker, and pin the fixture loop scope to silence pytest-asyncio's
# "unset" deprecation warning.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py", "smoke_*.py"]
# `scripts/` is deliberately NOT part of the built distribution — the
# setuptools config below packages only `app*` (and the Docker image copies
# only `app/`), so the ops/cron scripts are never installable. Putting the
# project root on sys.path lets tests import them directly (e.g.
# `from scripts.langfuse_alert import _sum_rows`).
pythonpath = ["."]

[tool.ruff.lint.isort]
known-first-party = ["app"]
