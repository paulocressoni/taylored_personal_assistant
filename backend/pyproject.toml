[project]
name = "backend"
version = "0.1.0"
description = "Smart home assistant backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
